<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>一梦江湖 · 回忆录</title>
    <!-- 引入唯美中文字体 -->
    <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@300;400&display=swap" rel="stylesheet">
    <style>
        /* 基础设置与背景 */
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #3b0764 100%);
            color: #e2e8f0;
            font-family: 'Noto Serif SC', serif;
            overflow-x: hidden;
        }

        /* 顶部标题区 */
        header {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            position: relative;
        }

        h1 {
            font-family: 'Ma Shan Zheng', cursive;
            font-size: 5rem;
            margin: 0;
            background: linear-gradient(to right, #fdfbfb, #ebedee, #a8c0ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(168, 192, 255, 0.5);
            animation: fadeInDown 2s ease-out;
        }

        .subtitle {
            font-size: 1.5rem;
            letter-spacing: 0.5em;
            margin-top: 20px;
            color: #94a3b8;
            animation: fadeInUp 2s ease-out 0.5s both;
        }

        /* 照片展示区 */
        .gallery {
            max-width: 1200px;
            margin: 0 auto;
            padding: 50px 20px;
            display: flex;
            flex-direction: column;
            gap: 150px; /* 图片间距 */
        }

        .photo-card {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transform: translateY(50px);
            transition: all 1.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        /* 左右交错布局 */
        .photo-card:nth-child(even) {
            flex-direction: row-reverse;
        }

        .photo-card.show {
            opacity: 1;
            transform: translateY(0);
        }

        .photo-img-container {
            width: 60%;
            position: relative;
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5), 0 0 20px rgba(168, 192, 255, 0.2);
            overflow: hidden;
            transition: transform 0.5s ease;
        }

        .photo-img-container::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 12px;
            pointer-events: none;
            z-index: 1;
        }

        .photo-img-container:hover {
            transform: scale(1.03) rotate(1deg);
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.7), 0 0 30px rgba(168, 192, 255, 0.4);
        }

        .photo-img-container img {
            width: 100%;
            display: block;
            transition: transform 2s ease;
        }

        .photo-img-container:hover img {
            transform: scale(1.1);
        }

        /* 文字描述 */
        .photo-text {
            width: 40%;
            padding: 0 40px;
            text-align: left;
        }

        .photo-card:nth-child(even) .photo-text {
            text-align: right;
        }

        .photo-text h2 {
            font-family: 'Ma Shan Zheng', cursive;
            font-size: 2.5rem;
            color: #e0e7ff;
            margin-bottom: 10px;
        }

        .photo-text p {
            font-size: 1.1rem;
            line-height: 1.8;
            color: #94a3b8;
        }

        /* 底部留白 */
        footer {
            height: 30vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Ma Shan Zheng', cursive;
            font-size: 1.8rem;
            color: #64748b;
            letter-spacing: 2px;
        }

        /* 动画关键帧 */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 响应式（手机端适配） */
        @media (max-width: 768px) {
            h1 { font-size: 3rem; }
            .subtitle { font-size: 1rem; }
            .photo-card, .photo-card:nth-child(even) {
                flex-direction: column;
                gap: 20px;
            }
            .photo-img-container, .photo-text {
                width: 100%;
            }
            .photo-text, .photo-card:nth-child(even) .photo-text {
                text-align: center;
                padding: 0;
            }
            .gallery { gap: 80px; }
        }
    </style>
</head>
<body>

    <!-- 飘落特效层 -->
    <div id="particles-js" style="position: fixed; width: 100%; height: 100%; top: 0; left: 0; z-index: 0; pointer-events: none;"></div>

    <header style="z-index: 1; position: relative;">
        <h1>一梦江湖 · 幸甚有你</h1>
        <div class="subtitle">我提笔 不为风雅 只为你</div>
    </header>

    <div class="gallery">
        <!-- 第一张：雪景与白狼 -->
        <div class="photo-card">
            <div class="photo-img-container">
                <img src="1.jpg" alt="雪景白狼">
            </div>
            <div class="photo-text">
                <h2>霜雪白头</h2>
                <p>忽有故人心上过，回首山河已是秋。两处相思同淋雪，此生也算共白头。</p>
            </div>
        </div>

        <!-- 第二张：双人绝美侧颜 -->
        <div class="photo-card">
            <div class="photo-img-container">
                <img src="2.jpg" alt="绝美侧颜">
            </div>
            <div class="photo-text">
                <h2>浮生若梦</h2>
                <p>行到水穷处，坐看云起时。这江湖再大，也不及你回眸一笑。</p>
            </div>
        </div>

        <!-- 第三张：海边沙滩 -->
        <div class="photo-card">
            <div class="photo-img-container">
                <img src="3.jpg" alt="海边沙滩">
            </div>
            <div class="photo-text">
                <h2>沧海一粟</h2>
                <p>听海风轻吟，看潮起潮落。我们在光影交错间，留下了最美的倒影。</p>
            </div>
        </div>

        <!-- 第四张：星空夜景 -->
        <div class="photo-card">
            <div class="photo-img-container">
                <img src="4.jpg" alt="星空夜景">
            </div>
            <div class="photo-text">
                <h2>星河长明</h2>
                <p>醉后不知天在水，满船清梦压星河。愿岁岁年年，身边皆是故人。</p>
            </div>
        </div>

        <!-- 第五张：粉色樱花 -->
        <div class="photo-card">
            <div class="photo-img-container">
                <img src="5.jpg" alt="粉色樱花">
            </div>
            <div class="photo-text">
                <h2>落樱缤纷</h2>
                <p>樱花落下的速度是每秒五厘米，而我走向你的速度，是这一生。</p>
            </div>
        </div>
    </div>

    <footer>
        —— 未完待续 ——
    </footer>

    <!-- 脚本：滚动淡入动画 -->
    <script>
        const cards = document.querySelectorAll('.photo-card');
        
        const observer = new IntersectionObserver(entries => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('show');
                }
            });
        }, { threshold: 0.2 });

        cards.forEach(card => {
            observer.observe(card);
        });

        // 简单的雪花/樱花瓣粒子特效 (纯JS轻量实现)
        const canvas = document.createElement('canvas');
        canvas.style.position = 'fixed';
        canvas.style.top = '0';
        canvas.style.left = '0';
        canvas.style.pointerEvents = 'none';
        canvas.style.zIndex = '9999';
        document.body.appendChild(canvas);
        const ctx = canvas.getContext('2d');
        
        let width, height;
        let particles = [];

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height - height;
                this.size = Math.random() * 3 + 1;
                this.speedY = Math.random() * 1 + 0.5;
                this.speedX = Math.random() * 1 - 0.5;
                this.opacity = Math.random() * 0.5 + 0.3;
            }
            update() {
                this.y += this.speedY;
                this.x += this.speedX;
                if (this.y > height) {
                    this.y = -10;
                    this.x = Math.random() * width;
                }
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`; // 白色雪花/花瓣
                ctx.fill();
            }
        }

        for (let i = 0; i < 100; i++) {
            particles.push(new Particle());
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
